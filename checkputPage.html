<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="rubrix_cube">
    </section>
    <section>
        <h2>Payment Information</h2>
        <form action="">
            <label 
                for="card-name" 
                aria-hidden="true">Card Name<span aria-hidden=true>*</span>
            </label>
            <input 
                type="text"
                id="card-name" 
                name="card-name" 
                required>
            <label 
                for="card-number" 
                aria-hidden="true">Card Number<span aria-hidden="true">*</span>
            </label>
            <input 
                type="text" 
                id="card-number" 
                name="card-number" 
                aria-describedby="card-number-help" 
                required>
            <p id="card-number-help">Your card number sould be in the format of "1234-1234-1234"</p>
        </form>
    </section>
</body>

</html>
